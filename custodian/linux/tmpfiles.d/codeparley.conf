# Phase 5 (contract §4.2): the runtime directories are root-owned and not writable by anyone else, so no unprivileged
# account can create, replace or rename a socket there; the store is setgid codeparley-read, so every file the custodian
# creates takes that group (UMask=0027: members read, others nothing). The custodian validates the whole store at every
# start; a mismatch is repaired by the operator's provisioning, never automatically.
d /run/codeparley         0755 root       root            -
d /run/codeparley-helper  0755 root       root            -
d /var/lib/codeparley     2750 codeparley codeparley-read -
# Increment 2 (§4.11): the export root inside the store — the bound implementer reaches its published tickets through the
# group's search right; the helper reaches its per-request directories through ONE traverse-only named entry on the store
# root and on exports/ (the custodian validates both ACLs at every start; nothing else in the store may carry one).
d  /var/lib/codeparley/exports 2710 codeparley codeparley-read -
a+ /var/lib/codeparley         -    -          -               - u:codeparley-helper:--x
a+ /var/lib/codeparley/exports -    -          -               - u:codeparley-helper:--x
